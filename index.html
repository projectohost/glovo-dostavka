
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodGo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h2>FoodGo</h2>
        <nav>
            <a href="#">Головна</a>
            <a href="#">Ресторани</a>
            <a href="#">Кошик</a>
        </nav>
    </header>

    <section class="hero">
        <h1>Доставка їжі до твоїх дверей</h1>
        <p>Обирай улюблені страви та замовляй онлайн</p>
        <button>Замовити зараз</button>
    </section>

    <section class="restaurants">
        <h2>Популярні заклади</h2>

        <div class="cards">
            <div class="card">
                <img src="" alt="Бургер">
                <h3>Burger House</h3>
                <p>Бургери та картопля фрі</p>
            </div>

            <div class="card">
                <img src="" alt="Піца">
                <h3>Pizza Time</h3>
                <p>Смачна італійська піца</p>
            </div>
        </div>
    </section>

</body>
</html>
